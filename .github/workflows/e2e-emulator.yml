name: E2E on Android emulator

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild and build x86_64 release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Create sample workbook
        run: |
          pip install openpyxl
          python3 - <<'PY'
          from openpyxl import Workbook
          wb = Workbook(); ws = wb.active
          ws.append(["رقم الطلب", "رقم الفاتورة", "كود الصنف", "الوحدة", "الكمية"])
          ws.append([5550001112223, "INV-1", 1001, "قطعة", 2])
          ws.append([5550001112223, "INV-1", 1002, "كرتونة", 1])
          ws.append([5550001112224, "INV-2", 2001, "قطعة", 1])
          ws.append([5550001112224, "INV-2", 2002, "قطعة", 2])
          ws.append([5550001112225, "INV-3", 3001, "قطعة", 1])
          ws.append([5550001112225, "INV-3", "12345678901", "قطعة", 1])
          wb.save("marsood-sample.xlsx")
          PY

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash e2e/emulator.sh
