name: Check and build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # يقرأ الإصدار من packageManager في package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm-lock.yaml [skip ci]"
            git push
          fi

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests (engine, importer, xlsx, report)
        run: pnpm exec vitest run tests/engine tests/importer tests/xlsx tests/base64 tests/report

      - name: Bundle JavaScript for Android
        run: pnpm exec expo export --platform android --output-dir /tmp/marsood-android

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          for i in 1 2 3 4 5 6; do ./gradlew --version --no-daemon && break; echo "gradle distribution download failed ($i); retrying in 40s"; sleep 40; done
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marsood-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
